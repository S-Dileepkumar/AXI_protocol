
name: AXI VIP Verilator CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "AXI_VIP/sim/results/**"

  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - "AXI_VIP/sim/results/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  axi-verilator:
    name: AXI VIP Build and Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make g++ cmake autoconf flex bison \
            help2man perl python3 libfl2 libfl-dev \
            zlib1g zlib1g-dev

      - name: Install Verilator 5.052
        run: |
          git clone --depth 1 --branch v5.052 \
            https://github.com/verilator/verilator.git \
            "$RUNNER_TEMP/verilator-src"

          cd "$RUNNER_TEMP/verilator-src"
          autoconf
          ./configure --prefix="$RUNNER_TEMP/verilator-install"
          make -j2
          make install

          echo "$RUNNER_TEMP/verilator-install/bin" >> "$GITHUB_PATH"

      - name: Verify Verilator
        run: verilator --version


      - name: Show tool versions
        run: |
          verilator --version
          make --version
          g++ --version

      - name: Download Verilator-compatible UVM
        run: |
          git clone --depth 1 \
            https://github.com/verilator/uvm.git \
            "$RUNNER_TEMP/uvm"

          test -f "$RUNNER_TEMP/uvm/src/uvm_pkg.sv"

      - name: Validate project
        run: |
          make -f Vmakefile.mk -C AXI_VIP/sim check \
            UVM_HOME="$RUNNER_TEMP/uvm"

      - name: Run lint
        run: |
          make -f Vmakefile.mk -C AXI_VIP/sim lint \
            UVM_HOME="$RUNNER_TEMP/uvm"

      - name: Build and simulate
        run: |
          make -f Vmakefile.mk -C AXI_VIP/sim run \
            UVM_HOME="$RUNNER_TEMP/uvm"

      - name: Commit logs and waveforms
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f AXI_VIP/sim/results/

          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi

          git commit -m "ci: update AXI VIP simulation results"

          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
